name: Deploy approved static survey artifact
"on":
  workflow_call:
permissions:
  contents: read
jobs:
  deploy:
    if: >-
      github.event.repository.private == false &&
      vars.OTH_PUBLICATION_ENABLED == 'true' &&
      vars.OTH_FREE_STORAGE_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy same-run artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
