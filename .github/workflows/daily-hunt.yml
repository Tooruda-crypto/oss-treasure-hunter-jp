name: Daily public survey
"on":
  schedule:
    - cron: '23 22 * * *' # 07:23 JST; delays/skips are possible.
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-fetch even if today already succeeded (bounded API usage)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-survey-and-pages
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.event.repository.private == false &&
      vars.OTH_PUBLICATION_ENABLED == 'true' &&
      vars.OTH_FREE_STORAGE_CONFIRMED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --offline --no-audit --no-fund
      - name: Restore bounded history or seed initial public data
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/oth-data > /dev/null; then
            git fetch --no-tags --depth=1 origin refs/heads/oth-data:refs/remotes/origin/oth-data
            node scripts/state.js restore work/state
          else
            code=$?
            test "$code" -eq 2
            node scripts/state.js seed work/state
          fi
      - name: Collect public data with read-only token
        id: hunt
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          if [ "$FORCE" = 'true' ]; then
            node src/cli.js hunt --root work/state --auth --force
          else
            node src/cli.js hunt --root work/state --auth
          fi
      - name: Validate and build the retained successful snapshot
        run: |
          node scripts/state.js validate work/state
          node src/cli.js build --root work/state
          node scripts/check.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: survey-state
          path: work/state/
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
          retention-days: 1
  persist:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: survey-state
          path: work/incoming-state
          digest-mismatch: error
      - name: Prepare data branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/oth-data > /dev/null; then
            git fetch --no-tags --depth=1 origin refs/heads/oth-data:refs/remotes/origin/oth-data
          else
            code=$?
            test "$code" -eq 2
          fi
          node scripts/state.js persist work/incoming-state
          git push origin HEAD:refs/heads/oth-data
  pages:
    needs: [collect, persist]
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
